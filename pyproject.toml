[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "getrom"
version = "1.0.0"
description = "Cross platform query tool for official vendor OTA firmware"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "RNA-ROM" }]
keywords = ["android", "ota", "firmware", "xiaomi", "vivo", "coloros"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Tracker tools (the ported VIVO-OTA-Tracker / OPlus-Tracker).
trackers = ["requests", "cryptography", "remotezip"]

[project.scripts]
getrom = "getrom.cli:main"

[project.urls]
Homepage = "https://github.com/littlepe/RNA-ROM-Public-Release"
Repository = "https://github.com/littlepe/RNA-ROM-Public-Release"
Issues = "https://github.com/littlepe/RNA-ROM-Public-Release/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
getrom = ["licenses/*/LICENSE", "licenses/THIRD_PARTY_LICENSES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
