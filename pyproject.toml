[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oem-unpack"
version = "1.0.0"
description = "Unpack the vendor firmware packages (Huawei, LG, Unisoc, Sony, OPPO, AMLogic, Rockchip, Nokia)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "RNA-ROM" }]
keywords = ["android", "firmware", "unpack", "huawei", "kdz", "pac", "ozip", "rkfw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
# Only the OPPO, the Sony and the newer LG DZ unpackers need these, the rest
# is pure Python.
oppo = ["cryptography", "lz4", "zstandard"]
all = ["cryptography", "lz4", "pyzstd", "zstandard"]

[project.scripts]
oem-unpack = "oem_unpack.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
